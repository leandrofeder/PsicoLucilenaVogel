    <!-- MAIN CONTENT -->

    <!-- FOOTER -->
    <footer role="contentinfo">
        <p>&copy; <span id="year"></span> Lucilena Vogel Pitz Feder &mdash; CRP 12/25849 &mdash; Todos os direitos reservados</p>
    </footer>

    <!-- Shared scripts -->
    <script src="scripts.js"></script>

    <!-- Blog-specific scripts -->
    <script>
        'use strict';

        document.getElementById('year').textContent = new Date().getFullYear();

        const BASE_URL = 'https://www.psicolucilenavogel.com.br';

        // ── Post index — add new slugs here ──────────────────────────────────────
        const POST_SLUGS = [
            'como-lidar-com-a-ansiedade',
            'como-melhorar-a-qualidade-do-sono-com-tcc'
        ];

        // ── Dynamic SEO ──────────────────────────────────────────────────────────
        function setMetaTags({ title, description, url, type = 'article', image }) {
            const img = image || `${BASE_URL}/assets/logo/logo.png`;

            document.title = title;
            document.querySelector('meta[name="description"]').content = description;
            document.getElementById('canonical').href = url;

            document.getElementById('og-title').content = title;
            document.getElementById('og-desc').content = description;
            document.getElementById('og-url').content = url;
            document.getElementById('og-type').content = type;
            document.getElementById('og-image').content = img;

            document.getElementById('tw-title').content = title;
            document.getElementById('tw-desc').content = description;
            document.getElementById('tw-image').content = img;
        }

        function setJsonLD(data) {
            document.getElementById('jsonld-blog').textContent = JSON.stringify(data, null, 2);
        }

        // ── Utilities ────────────────────────────────────────────────────────────
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            const months = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
            return `${parseInt(d)} de ${months[parseInt(m) - 1]} de ${y}`;
        }

        function extractFirstImage(html) {
            if (!html) return null;
            const temp = document.createElement('div');
            temp.innerHTML = html;
            const img = temp.querySelector('img');
            return img ? img.getAttribute('src') : null;
        }

        function stripHtml(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        async function fetchPost(slug) {
            const res = await fetch(`/posts/${slug}.json`);
            if (!res.ok) throw new Error(`Post "${slug}" não encontrado.`);
            const post = await res.json();
            post.slug = slug;
            return post;
        }

        // ── Renderers ────────────────────────────────────────────────────────────
        function renderList(posts) {
            setMetaTags({
                title: 'Blog | Psicóloga Lucilena Vogel',
                description: 'Artigos sobre saúde mental, ansiedade, depressão e bem-estar emocional.',
                url: `${BASE_URL}/blog`,
                type: 'website'
            });

            setJsonLD({
                '@context': 'https://schema.org',
                '@type': 'Blog',
                name: 'Blog | Psicóloga Lucilena Vogel',
                url: `${BASE_URL}/blog`,
                description: 'Artigos sobre saúde mental, ansiedade e bem-estar emocional.',
                author: { '@type': 'Person', name: 'Lucilena Vogel', url: BASE_URL },
                blogPost: posts.map(p => ({
                    '@type': 'BlogPosting',
                    headline: p.title,
                    url: `${BASE_URL}/blog/${p.slug}`,
                    datePublished: p.date,
                    description: p.excerpt,
                    author: { '@type': 'Person', name: p.author || 'Lucilena Vogel' }
                }))
            });

            const main = document.getElementById('blog-main');

            if (posts.length === 0) {
                main.innerHTML = `
                    <section class="blog-hero" aria-labelledby="blog-heading">
                        <h1 id="blog-heading">Blog</h1>
                        <p>Artigos sobre saúde mental, bem-estar emocional e autoconhecimento.</p>
                    </section>
                    <div class="blog-list">
                        <p class="blog-empty">Nenhum artigo publicado ainda. Volte em breve.</p>
                    </div>`;
                return;
            }

            const cards = posts.map(p => `
                <a href="/blog/${p.slug}" class="post-card" onclick="handleBlogNav(event,'${p.slug}')">
                    ${p.image ? `<img class="post-cover" src="${p.image}" alt="${p.title}" loading="lazy" decoding="async">` : ''}
                    <div class="post-card-body">
                        <div class="post-meta">${formatDate(p.date)}</div>
                        <h2>${p.title}</h2>
                        <p>${p.excerpt}</p>
                        <span class="post-link">Ler artigo <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
                    </div>
                </a>`).join('');

            main.innerHTML = `
                <section class="blog-hero" aria-labelledby="blog-heading">
                    <h1 id="blog-heading">Blog</h1>
                    <p>Artigos sobre saúde mental, bem-estar emocional e autoconhecimento.</p>
                </section>
                <div class="blog-list" role="feed" aria-label="Lista de artigos">${cards}</div>`;
        }

        function renderArticle(post) {
            const url = `${BASE_URL}/blog/${post.slug}`;
            const plainText = stripHtml(post.content);
            const coverImage = post.image || extractFirstImage(post.content);
            const desc = post.excerpt || plainText.slice(0, 155).trim() + '…';

            setMetaTags({
                title: `${post.title} | Psicóloga Lucilena Vogel`,
                description: desc,
                url,
                type: 'article',
                image: coverImage || null
            });

            setJsonLD({
                '@context': 'https://schema.org',
                '@type': 'BlogPosting',
                headline: post.title,
                description: desc,
                url,
                datePublished: post.date,
                dateModified: post.updated || post.date,
                author: { '@type': 'Person', name: post.author || 'Lucilena Vogel', url: BASE_URL },
                publisher: {
                    '@type': 'Person',
                    name: 'Lucilena Vogel',
                    logo: { '@type': 'ImageObject', url: `${BASE_URL}/assets/logo/logo.png` }
                },
                mainEntityOfPage: { '@type': 'WebPage', '@id': url },
                image: coverImage || `${BASE_URL}/assets/logo/logo.png`,
                articleBody: plainText
            });

            const main = document.getElementById('blog-main');
            main.innerHTML = `
                <article class="article-wrapper">
                    <a href="/blog" class="article-back" onclick="handleBlogNav(event,null)">
                        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar para o blog
                    </a>
                    <header>
                        <div class="article-meta">${formatDate(post.date)}${post.author ? ' · ' + post.author : ''}</div>
                        <h1 class="article-title">${post.title}</h1>
                    </header>
                    ${coverImage ? `<img class="article-cover" src="${coverImage}" alt="${post.title}" loading="eager" decoding="async">` : ''}
                    <hr class="article-divider">
                    <div class="article-body">${post.content}</div>
                </article>`;

            // Scroll to top smoothly
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderError(msg) {
            const main = document.getElementById('blog-main');
            main.innerHTML = `
                <div class="article-wrapper">
                    <div class="blog-error">
                        <i class="fa-regular fa-face-sad-tear" aria-hidden="true"></i>
                        <h2>Artigo não encontrado</h2>
                        <p>${msg}</p>
                        <a href="/blog" class="btn btn-primary" onclick="handleBlogNav(event,null)">Ver todos os artigos</a>
                    </div>
                </div>`;
        }

        // ── Navigation ───────────────────────────────────────────────────────────
        async function loadBlog(slug, pushState = true) {
            document.getElementById('blog-main').innerHTML =
                `<div class="blog-loading" role="status" aria-live="polite"><i class="fa-solid fa-circle-notch" aria-hidden="true"></i><span>Carregando...</span></div>`;

            try {
                if (slug) {
                    const post = await fetchPost(slug);
                    renderArticle(post);
                    if (pushState) window.history.pushState({ slug }, '', `/blog/${slug}`);
                } else {
                    const posts = await Promise.all(
                        POST_SLUGS.map(s => fetchPost(s).catch(() => null))
                    );
                    renderList(posts.filter(Boolean).sort((a, b) => b.date?.localeCompare(a.date)));
                    if (pushState) window.history.pushState({ slug: null }, '', '/blog');
                }
                if (typeof gtag !== 'undefined') {
                    gtag('event', 'page_view', { page_path: window.location.pathname });
                }
            } catch (err) {
                renderError(err.message || 'Não foi possível carregar o conteúdo.');
            }
        }

        function handleBlogNav(event, slug) {
            event.preventDefault();
            loadBlog(slug);
        }

        window.addEventListener('popstate', () => {
            loadBlog(getSlugFromPath(), false);
        });

        function getSlugFromPath() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('post')) return params.get('post');
            const match = window.location.pathname.match(/\/blog\/([^/]+)/);
            return match ? match[1] : null;
        }

        // ── Init ─────────────────────────────────────────────────────────────────
        loadBlog(getSlugFromPath(), false);
    </script>
</body>
